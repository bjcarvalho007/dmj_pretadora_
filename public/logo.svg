<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="8" />

  <!-- Geometric Shield Outer Glow -->
  <path d="M256 64 L384 128 V272 C384 360 328 424 256 448 C184 424 128 360 128 272 V128 Z" 
        fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Shield Main Accent -->
  <path d="M256 80 L368 136 V264 C368 344 318 404 256 428 C194 404 144 344 144 264 V136 Z" 
        fill="#030712" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- House Roof & Leaf Crown -->
  <path d="M256 120 L330 180 H182 Z" fill="url(#emeraldGrad)" />
  
  <!-- Leaf Ribbon in Roof -->
  <path d="M256 120 C280 140 300 170 300 190 C270 190 240 160 256 120 Z" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Electrical Bolt Spark (Center Accent) -->
  <path d="M265 190 L245 235 H265 L245 280 L275 225 H255 Z" fill="url(#goldGrad)" />

  <!-- Paint / Glass Clean Wave Sheen -->
  <path d="M190 280 Q256 250 322 280 T380 280" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Text "DMJ" stylized -->
  <text x="256" y="365" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="92" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="6"
        fill="url(#goldGrad)">DMJ</text>

  <!-- Subtitle SERVICES -->
  <text x="256" y="402" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="8"
        fill="#34d399">SERVICES</text>
</svg>
